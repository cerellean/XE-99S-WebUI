# ============================================================================
#  XE-99S WebUI 运行配置
#  修改后需重启本服务: /userdata/webui/init.d/S99webui restart
#
#  适用固件:
#    - SIEPON Package-C (CTC20220901, CIG 原厂, 中国电信 CTC 标准)  <- 默认按此校准
#    - SIEPON Package-A (YuukiJapanTech 自定义 v1.x)
#  两者差异由 lib/probe.sh 启动时实测, 本文件只提供人工覆盖项。
# ============================================================================

# 监听端口
#   原厂 Package-C 固件没有自带 WebUI, 80 通常是空闲的, 想省事可直接改 80;
#   若刷过 Package-A 固件, 它的 WebUI 占着 80, 请保持 8080。
PORT=8080

# 只监听该地址(留空表示所有地址)
BIND=

# 登录用户名
WEBUI_USER=admin

# 登录有效时长(秒)
SESSION_TTL=3600

# 版本号
WEBUI_VERSION=1.1.0

# ---------------------------------------------------------------------------
# 设备相关参数
#   以下大多为"留空即自动探测", 只有自检页显示探测失败时才需手工指定。
# ---------------------------------------------------------------------------

# ca-iros 查询 EPON 状态用的 port_id
#   留空 = 依次试 0x20007 / 0x20006 / 0x20001 / 0x10007, 用能返回 CA_E_OK 的那个
PON_PORT_ID=

# 光模块 DDM 所在的 i2c 总线与地址
I2C_BUS=0
I2C_ADDR=0x50

# scfg.txt 写入路径覆盖
#   留空 = 由 probe.sh 实测 (含 overlay 上层 /overlay/upper/config/scfg.txt)
#   原厂 Package-C 的 rootfs 多为只读 squashfs, 写入必须落到 overlay 上层,
#   若探测结果不对再在此手工写死, 例如:
#   SCFG_WRITE_OVERRIDE="/overlay/upper/config/scfg.txt"
SCFG_WRITE_OVERRIDE=

# httpd 可执行文件(留空自动探测)
HTTPD=
