# ============================================================================
#  XE-99S WebUI 运行配置
#  修改后需重启本服务: /userdata/webui/init.d/S99webui restart
#
#  适用固件: SIEPON Package-C（CIG 原厂 / 中国电信 CTC 标准, 无自带 WebUI）
#  不同批次的 rootfs 布局可能不同, 差异由 lib/probe.sh 运行时实测,
#  本文件只提供人工覆盖项。
# ============================================================================

# 监听端口
#   原厂固件没有自带 WebUI, 80 通常是空闲的, 想省事可直接改 80;
#   若同机还有其他服务占着 80, 保持 8080。
PORT=8080

# 只监听该地址(留空表示所有地址)
BIND=

# 登录用户名
WEBUI_USER=admin

# 登录有效时长(秒)
SESSION_TTL=3600

# 版本号
WEBUI_VERSION=2.0.0

# ---------------------------------------------------------------------------
# 设备相关参数
#   以下为"留空即用原厂默认值", 只有自检页显示异常时才需手工指定。
# ---------------------------------------------------------------------------

# EPON PON 口的 port_id
#   原厂固件自己的脚本用的就是 0x20007（UNI 口 0x30006）, 一般不用改。
PON_PORT_ID=0x20007

# scfg.txt 写入路径覆盖
#   留空 = 由 probe.sh 实测: /config/scfg.txt（可写时）→ overlay 上层 → /userdata
#   原厂固件读的是 /config/scfg.txt, 改别的文件不会生效, 只在特殊布局下
#   才需要在这里写死, 例如:
#   SCFG_WRITE_OVERRIDE="/overlay/upper/config/scfg.txt"
SCFG_WRITE_OVERRIDE=

# httpd 可执行文件(留空自动探测)
HTTPD=
